<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover GitHub profiles with stats, repos and more." />
    <meta name="author" content="sak3y" />
    <meta name="keywords" content="GitHub, API, User, Profile, Search" />
    <title>GitHub Profile Viewer</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
    <script defer src="index.js"></script>
  </head>

  <body>
    <div class="container">
      <h1>GitHub Viewer</h1>
      <p>Discover GitHub profiles with stats, repos and more.</p>

      <div class="user-input">
        <input
          id="input"
          name="username"
          type="text"
          placeholder="Type Username..."
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <button id="submit-btn">View Profile</button>

      <article class="profile">
        <div id="stats" class="hide"></div>
      </article>
    </div>
  </body>
</html>
